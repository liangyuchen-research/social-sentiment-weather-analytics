# COMP90024 Team 2

# Official Fission Python 3.9 runtime, pinned to verified registry digests.
# The original deployment used a teaching-staff image. Function dependencies
# are now vendored in each deployment archive, independent of that image.
apiVersion: fission.io/v1
kind: Environment
metadata:
  name: python39x
  namespace: default
spec:
  version: 3
  runtime:
    image: fission/python-env-3.9@sha256:44c9f6afbc6b3257dcf980d6a0c729e0ac90c2a751936e4d6cb9535f283d5b1b
  builder:
    image: fission/python-builder-3.9@sha256:8118fc698b4ddbde9da45ac39792801d5b3735edb1734f41fa023fa4617b4e8f
    command: build
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  poolsize: 3
