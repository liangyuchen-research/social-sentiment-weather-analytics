# COMP90024 Team 2

# Optional: run clean_posts every 10 minutes for streaming demo.
# Comment out if you only want HTTP-triggered cleaning.
apiVersion: fission.io/v1
kind: TimeTrigger
metadata:
  name: timer-clean-posts-every-10min
  namespace: default
spec:
  cron: "*/10 * * * *"
  functionref:
    type: name
    name: clean-posts
