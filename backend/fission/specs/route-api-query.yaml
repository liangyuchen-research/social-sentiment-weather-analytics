# COMP90024 Team 2

# ★ The single endpoint the Jupyter notebook frontend calls.
# All other Fission functions (harvest_reddit, clean_posts) run in the
# background and are NOT exposed to the frontend.
apiVersion: fission.io/v1
kind: HTTPTrigger
metadata:
  name: route-api-query
  namespace: default
spec:
  host: ""
  relativeurl: /api/query
  method: GET
  functionref:
    type: name
    name: api-query
