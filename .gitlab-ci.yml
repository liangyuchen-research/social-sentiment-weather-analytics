# COMP90024 Team 2

image: python:3.12-slim

stages:
  - validate
  - test
  - package
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR:$CI_PROJECT_DIR/database"
  FISSION_VERSION: "1.22.0"
  FISSION_FUNCTIONS: "api_query clean_posts harvest_reddit harvest_social harvest_weather"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

.python_setup:
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt

python_syntax:
  stage: validate
  extends: .python_setup
  script:
    - python -m compileall backend database test

notebook_validation:
  stage: validate
  image: python:3.12-slim
  script:
    - |
      python - <<'PY'
      import json
      from pathlib import Path

      for path in sorted([*Path("frontend").glob("*.ipynb"), *Path("test").glob("*.ipynb")]):
          with path.open("r", encoding="utf-8") as fh:
              json.load(fh)
          print(f"valid notebook json: {path}")
      PY

yaml_validation:
  stage: validate
  extends: .python_setup
  script:
    - |
      python - <<'PY'
      from pathlib import Path
      import yaml

      for path in [Path(".gitlab-ci.yml"), *Path("installation").glob("*.yaml"), *Path("backend/fission/specs").glob("*.yaml")]:
          with path.open("r", encoding="utf-8") as fh:
              yaml.safe_load(fh)
          print(f"valid yaml: {path}")
      PY

fission_spec_validation:
  stage: validate
  extends: .python_setup
  script:
    - |
      python - <<'PY'
      import os
      from pathlib import Path
      import yaml

      specs = Path("backend/fission/specs")
      functions = {
          path.name
          for path in Path("backend/fission/functions").iterdir()
          if path.is_dir() and (path / "main.py").exists()
      }
      expected = set(os.environ["FISSION_FUNCTIONS"].split())
      if functions != expected:
          raise SystemExit(f"Fission function directories mismatch: expected {sorted(expected)}, got {sorted(functions)}")

      for name in sorted(expected):
          dash = name.replace("_", "-")
          required = [
              specs / f"archive-{dash}.yaml",
              specs / f"package-{dash}.yaml",
              specs / f"function-{dash}.yaml",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f"Missing Fission spec files for {name}: {missing}")

          archive = yaml.safe_load((specs / f"archive-{dash}.yaml").read_text(encoding="utf-8"))
          includes = archive.get("include") or []
          if includes != [f"{name}.zip"]:
              raise SystemExit(f"Archive spec for {name} should include {name}.zip, got {includes}")

          package = yaml.safe_load((specs / f"package-{dash}.yaml").read_text(encoding="utf-8"))
          deployment_url = package["spec"]["deployment"]["url"]
          if deployment_url != f"archive://{dash}-zip":
              raise SystemExit(f"Package spec for {name} points at {deployment_url}")

          function = yaml.safe_load((specs / f"function-{dash}.yaml").read_text(encoding="utf-8"))
          package_ref = function["spec"]["package"]["packageref"]["name"]
          if package_ref != f"pkg-{dash}":
              raise SystemExit(f"Function spec for {name} uses package {package_ref}")

          print(f"valid fission spec set: {name}")
      PY

unit_tests:
  stage: test
  extends: .python_setup
  script:
    - pytest test/unit_test --cov=backend --cov=database --cov-report=term-missing --cov-report=xml --junitxml=unit-tests.xml
  artifacts:
    when: always
    reports:
      junit: unit-tests.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - unit-tests.xml

integration_tests:
  stage: test
  extends: .python_setup
  script:
    - pytest test/integration_test --junitxml=integration-tests.xml
  artifacts:
    when: always
    reports:
      junit: integration-tests.xml
    paths:
      - integration-tests.xml

data_quality_tests:
  stage: test
  extends: .python_setup
  script:
    - pytest test/data_quality_test --junitxml=data-quality-tests.xml
  artifacts:
    when: always
    reports:
      junit: data-quality-tests.xml
    paths:
      - data-quality-tests.xml

fission_package:
  stage: package
  extends: .python_setup
  script:
    - cd backend/fission
    - python build_deploy_archives.py
    - |
      for function in $FISSION_FUNCTIONS; do
        test -s "${function}.zip"
      done
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/fission/*.zip

deploy_fission:
  stage: deploy
  image: alpine:3.20
  needs:
    - fission_package
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $KUBE_CONFIG_B64 != null && $ES_HOST != null && $ES_PASSWORD != null'
      when: manual
    - when: never
  before_script:
    - apk add --no-cache bash ca-certificates curl kubectl
    - curl -Lo /usr/local/bin/fission "https://github.com/fission/fission/releases/download/v${FISSION_VERSION}/fission-v${FISSION_VERSION}-linux-amd64"
    - chmod +x /usr/local/bin/fission
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - kubectl config current-context
    - |
      set -- --from-literal=ES_HOST="$ES_HOST" \
        --from-literal=ES_USER="${ES_USER:-elastic}" \
        --from-literal=ES_PASSWORD="$ES_PASSWORD" \
        --from-literal=ES_VERIFY_CERTS="${ES_VERIFY_CERTS:-true}"
      if [ -n "${ES_CA_CERT_FILE:-}" ]; then
        set -- "$@" --from-file=ca.crt="$ES_CA_CERT_FILE" \
          --from-literal=ES_CA_CERTS=/secrets/default/es-creds/ca.crt
      fi
      kubectl create secret generic es-creds --namespace default "$@" \
        --dry-run=client -o yaml | kubectl apply -f -
    - |
      if [ -n "$BLUESKY_HANDLE$BLUESKY_APP_PASSWORD$MASTODON_ACCESS_TOKEN$MASTODON_INSTANCE" ]; then
        kubectl create secret generic social-creds \
          --namespace default \
          --from-literal=BLUESKY_HANDLE="${BLUESKY_HANDLE:-}" \
          --from-literal=BLUESKY_APP_PASSWORD="${BLUESKY_APP_PASSWORD:-}" \
          --from-literal=BLUESKY_SERVICE="${BLUESKY_SERVICE:-https://bsky.social}" \
          --from-literal=BLUESKY_APPVIEW="${BLUESKY_APPVIEW:-https://public.api.bsky.app}" \
          --from-literal=MASTODON_ACCESS_TOKEN="${MASTODON_ACCESS_TOKEN:-}" \
          --from-literal=MASTODON_INSTANCE="${MASTODON_INSTANCE:-https://aus.social}" \
          --dry-run=client -o yaml | kubectl apply -f -
      else
        kubectl get secret social-creds --namespace default >/dev/null 2>&1 || \
          kubectl create secret generic social-creds --namespace default --from-literal=HARVEST_MAX_RECORDS=100
      fi
    - cd backend/fission
    - |
      for function in $FISSION_FUNCTIONS; do
        test -s "${function}.zip"
      done
    - fission spec apply --specdir specs/
    - fission function list
    - fission route list
    - fission function test --name api-query --method GET --query "mode=health"
